<div class="pwd-strength-wrapper">

  <!-- 5 CASES AVEC COCHE VERTE -->
  <div class="pwd-rules-grid">

    <div class="pwd-rule" [class.met]="r.minLength">
      <div class="rule-dot" [class.active]="r.minLength">
        <svg *ngIf="r.minLength" viewBox="0 0 12 12" fill="none">
          <polyline points="2 6 5 9 10 3" stroke="white"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="rule-label">8 caractères min.</span>
    </div>

    <div class="pwd-rule" [class.met]="r.uppercase">
      <div class="rule-dot" [class.active]="r.uppercase">
        <svg *ngIf="r.uppercase" viewBox="0 0 12 12" fill="none">
          <polyline points="2 6 5 9 10 3" stroke="white"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="rule-label">1 Majuscule (A-Z)</span>
    </div>

    <div class="pwd-rule" [class.met]="r.lowercase">
      <div class="rule-dot" [class.active]="r.lowercase">
        <svg *ngIf="r.lowercase" viewBox="0 0 12 12" fill="none">
          <polyline points="2 6 5 9 10 3" stroke="white"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="rule-label">1 minuscule (a-z)</span>
    </div>

    <div class="pwd-rule" [class.met]="r.digit">
      <div class="rule-dot" [class.active]="r.digit">
        <svg *ngIf="r.digit" viewBox="0 0 12 12" fill="none">
          <polyline points="2 6 5 9 10 3" stroke="white"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="rule-label">1 chiffre (0-9)</span>
    </div>

    <div class="pwd-rule" [class.met]="r.special">
      <div class="rule-dot" [class.active]="r.special">
        <svg *ngIf="r.special" viewBox="0 0 12 12" fill="none">
          <polyline points="2 6 5 9 10 3" stroke="white"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="rule-label">1 signe (&#64;#$%!)</span>
    </div>

  </div>

  <!-- BARRE DE PROGRESSION -->
  <div class="strength-bar-track">
    <div class="strength-bar-fill"
      [style.width]="strengthPercent + '%'"
      [ngClass]="strengthClass">
    </div>
  </div>

  <!-- MESSAGE RÉSULTAT -->
  <div *ngIf="password.length > 0"
    class="pwd-status"
    [class.status-success]="isValid"
    [class.status-error]="!isValid">

    <!-- Icône succès -->
    <svg *ngIf="isValid" viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="2">
      <circle cx="10" cy="10" r="8"/>
      <polyline points="6 10 9 13 14 7"/>
    </svg>

    <!-- Icône erreur -->
    <svg *ngIf="!isValid" viewBox="0 0 20 20" fill="none"
      stroke="currentColor" stroke-width="2">
      <circle cx="10" cy="10" r="8"/>
      <line x1="10" y1="6" x2="10" y2="11"/>
      <circle cx="10" cy="14" r="0.5" fill="currentColor"/>
    </svg>

    <span>{{ isValid ? 'Mot de passe fort — parfait !' : errorMessage }}</span>
  </div>

</div>
